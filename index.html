<style>
  :root{
    --core:#FFCF6B; --foundation:#79E7FF; --systems:#7FB4FF; --operations:#66E6C8; --network:#B79BFF;
    --ink:#E8EDF9; --mute:#7C89A6; --bg:#04050c; --panel:rgba(10,13,26,0.78); --line:rgba(120,150,220,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;overflow:hidden;}
  h1,h2,h3,h4{font-family:'Raleway',system-ui,sans-serif;letter-spacing:-0.01em;margin:0;}
  #graph{position:fixed;inset:0;}
  #graph canvas{display:block;}
  #atmos{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(1100px 640px at 20% 38%, rgba(60,90,180,0.10), transparent 62%),
      radial-gradient(1000px 900px at 84% 74%, rgba(150,110,220,0.09), transparent 60%),
      radial-gradient(760px 520px at 58% 18%, rgba(40,160,200,0.06), transparent 60%);
    mix-blend-mode:screen;}
  #scan{position:fixed;inset:0;pointer-events:none;opacity:.55;
    background:radial-gradient(circle at 50% 48%, transparent 58%, rgba(2,3,9,0.6) 100%);}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .node-label{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;transition:opacity .25s;
    font-family:'Raleway',sans-serif;text-shadow:0 0 16px rgba(0,0,0,0.95),0 1px 3px rgba(0,0,0,0.9);}
  .node-label.is-root{font-size:13px;font-weight:800;color:#fff;letter-spacing:0.16em;text-transform:uppercase;}
  .node-label.is-spine{font-size:11px;font-weight:700;color:var(--c);letter-spacing:0.14em;text-transform:uppercase;opacity:.94;}
  .node-label .ld{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:middle;box-shadow:0 0 12px var(--c);}
  #tip{position:fixed;pointer-events:none;z-index:12;transform:translate(-50%,-160%);opacity:0;transition:opacity .12s;
    font-family:'Raleway';font-weight:700;font-size:11.5px;color:#fff;background:rgba(6,9,18,0.9);border:1px solid var(--line);
    border-radius:8px;padding:5px 10px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.55);}

  .hud{position:fixed;pointer-events:none;z-index:10;}
  .hud .clickable, .hud button, .hud input{pointer-events:auto;}
  #brand{top:20px;left:24px;display:flex;align-items:center;gap:12px;}
  #brand .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(150deg,#1E56A0,#0a1f3d);border:1px solid rgba(130,170,255,0.4);
    font-family:'Raleway';font-weight:800;font-size:14px;color:#fff;box-shadow:0 0 30px rgba(40,90,180,0.55), inset 0 0 12px rgba(120,170,255,0.25);}
  #brand h1{font-size:15px;font-weight:800;line-height:1.05;}
  #brand .sub{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--mute);margin-top:4px;}
  #toolbar{top:18px;right:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:72vw;}
  .glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:12px;}
  .btn{font-family:'Raleway';font-weight:600;font-size:11px;color:#c4d0e8;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:8px 12px;cursor:pointer;transition:all .16s;backdrop-filter:blur(14px);display:inline-flex;align-items:center;gap:7px;letter-spacing:0.02em;}
  .btn:hover{border-color:rgba(130,170,255,0.5);color:#fff;background:rgba(26,40,74,0.7);}
  .btn.on{border-color:rgba(121,231,255,0.55);color:#e6fbff;box-shadow:0 0 18px rgba(121,231,255,0.22);}
  .btn.save{color:#04241a;background:linear-gradient(150deg,#66E6C8,#17b892);border-color:transparent;font-weight:700;}
  .btn.save:hover{filter:brightness(1.08);color:#021a12;}
  #search{display:flex;align-items:center;gap:8px;padding:7px 12px;}
  #search input{background:transparent;border:0;outline:0;color:#fff;font-size:12px;width:148px;font-family:'Open Sans';}
  #search input::placeholder{color:#67738f;}
  .rounds{display:flex;gap:3px;padding:4px;}
  .rounds button{font-family:'JetBrains Mono';font-weight:700;font-size:11px;color:#9fb0d0;background:transparent;border:0;border-radius:8px;padding:5px 10px;cursor:pointer;transition:all .16s;}
  .rounds button.active{background:linear-gradient(150deg,#1E56A0,#123763);color:#fff;box-shadow:0 0 15px rgba(40,90,180,0.5);}
  #legend{bottom:20px;left:24px;padding:14px 16px;font-size:11px;max-width:250px;}
  #legend h4{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--mute);margin-bottom:11px;}
  #legend .row{display:flex;align-items:center;gap:10px;margin:7px 0;color:#c6d2e8;}
  #legend .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 12px currentColor,0 0 4px currentColor;}
  #legend .hint{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);color:var(--mute);font-size:10px;line-height:1.65;}
  #flow{bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;pointer-events:none;}
  #flow .cap{font-family:'JetBrains Mono';font-size:9px;letter-spacing:0.24em;text-transform:uppercase;color:var(--mute);}

    background:linear-gradient(90deg,rgba(255,207,107,0.7),rgba(127,180,255,0.6),rgba(102,230,200,0.6),rgba(183,155,255,0.75));box-shadow:0 0 14px rgba(120,160,255,0.35);}
  #flow .bar::before,#flow .bar::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;}
  #flow .bar::before{left:-2px;background:#FFCF6B;box-shadow:0 0 12px #FFCF6B;}
  #flow .bar::after{right:-2px;background:#B79BFF;box-shadow:0 0 12px #B79BFF;}
  #stats{bottom:20px;right:24px;display:flex;gap:20px;padding:10px 18px;font-size:10px;}
  #stats b{font-family:'JetBrains Mono';color:#fff;font-size:13px;}
  #stats .s{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);text-transform:uppercase;letter-spacing:0.12em;}
  #panel{position:fixed;top:0;right:0;height:100%;width:min(390px,90vw);z-index:20;
    background:linear-gradient(180deg,rgba(9,13,26,0.97),rgba(5,7,15,0.98));border-left:1px solid var(--line);backdrop-filter:blur(18px);

  #panel .top{padding:24px 24px 18px;border-bottom:1px solid var(--line);position:relative;}
  #panel .top::after{content:'';position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:var(--c);box-shadow:0 0 16px var(--c);}
  #panel .kind{font-family:'JetBrains Mono';font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--c);}
  #panel h2{font-size:21px;font-weight:800;margin-top:9px;line-height:1.15;color:#fff;}
  #panel .timing{display:inline-block;margin-top:12px;font-family:'JetBrains Mono';font-size:10px;color:#d0dbef;background:rgba(255,255,255,0.05);border:1px solid var(--line);padding:4px 10px;border-radius:7px;}
  #panel .body{padding:20px 24px;overflow-y:auto;flex:1;}
  #panel .desc{font-size:13px;line-height:1.68;color:#c4d0e8;}
  #panel .lab{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute);margin:22px 0 9px;display:flex;align-items:center;justify-content:space-between;}
  #panel textarea{width:100%;min-height:118px;resize:vertical;background:rgba(255,255,255,0.04);color:#eef3ff;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12.5px;line-height:1.55;font-family:'Open Sans';outline:0;transition:border .16s;}
  #panel textarea:focus{border-color:var(--c);background:rgba(255,255,255,0.06);}
  #panel .addbox{display:flex;gap:8px;}
  #panel .addbox input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:#fff;font-size:12px;outline:0;font-family:'Open Sans';}
  #panel .addbox input:focus{border-color:var(--c);}
  #panel .addbox button{background:var(--c);color:#0a1020;border:0;border-radius:11px;padding:0 16px;font-family:'Raleway';font-weight:800;font-size:17px;cursor:pointer;}
  #panel .close{position:absolute;top:20px;right:20px;z-index:5;width:31px;height:31px;border-radius:9px;cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid var(--line);color:#d0dbef;font-size:16px;line-height:1;display:grid;place-items:center;}
  #panel .close:hover{background:rgba(255,255,255,0.12);color:#fff;}
  #panel .note-scope{font-family:'JetBrains Mono';color:var(--c);font-weight:700;}
  #panel .conngrp{margin-bottom:8px;}
  #panel .cglab{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mute);margin:2px 0 6px;}
  #panel .conn{display:inline-flex;align-items:center;gap:7px;max-width:100%;text-align:left;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin:0 6px 6px 0;color:#dbe4f5;font-size:11.5px;font-family:'Open Sans';cursor:pointer;transition:all .15s;}
  #panel .conn:hover{border-color:var(--cc);background:rgba(255,255,255,0.08);color:#fff;}
  #panel .conn .cdot{width:7px;height:7px;border-radius:50%;background:var(--cc);box-shadow:0 0 8px var(--cc);flex:0 0 auto;}
  #boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:40px;z-index:100;}
  #boot h1{color:#7FB4FF;font-size:19px;margin-bottom:12px;}
  #boot p{color:#7C89A6;max-width:520px;font-size:13px;line-height:1.6;}
  #boot-err{color:#fb7185;font-family:'JetBrains Mono';font-size:12px;white-space:pre-wrap;margin-top:16px;}
  @media (max-width:760px){ #brand h1{font-size:13px;} #toolbar{max-width:66vw;gap:6px;} #search input{width:90px;} #legend,#flow,#stats{display:none;} }
</style>
</head>
<body>
<div id="graph"></div>
<div id="atmos"></div>

  <h1>Forming the planning canvas…</h1>
  <p>Rendering the 24-month plan as an interactive 3D web. If this persists, check the network connection (the 3D engine streams from a CDN) or the browser console.</p>
  <p id="boot-err"></p>
</div></div>
<div id="root"></div>

<script>
  window.addEventListener('error', function(e){var el=document.getElementById('boot-err');if(el)el.textContent='Error: '+(e.message||e)+(e.filename?('\n'+e.filename+':'+e.lineno):'');});
  window.addEventListener('unhandledrejection', function(e){var el=document.getElementById('boot-err');if(el)el.textContent='Promise rejection: '+(e.reason&&e.reason.message?e.reason.message:e.reason);});
</script>
